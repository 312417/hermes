model:
  provider: "opencodex"
  default: "gpt-6-luna"
  max_history: 10        # Janela deslizante: 10 últimas mensagens
  max_tokens: 4000

fallback_model:
  - provider: "opencodex"
    model: "google-antigravity/gemini-3.8-flash"
  - provider: "openrouter"
    model: "google/gemini-3.8-flash"

platform_toolsets:
  telegram: [web, file, skills, todo, messaging, terminal, code_execution, memory, session_search, cronjob, vision]

telegram:
  dm_policy: "open"

memory:
  enabled: true

curator:
  enabled: true
  model: "google-antigravity/gemini-3.8-flash"

timezone: "America/Sao_Paulo"

