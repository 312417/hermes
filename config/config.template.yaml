# Hermes Agent — Configuração
# Provedor principal: OpenCodex (Luna 1º, Gemini 3.8 2º)

providers:
  opencodex:
    base_url: "http://212.85.23.10:10100/v1"
    api_key: "ocx-local"
    api_mode: "chat_completions"
  openrouter:
    key_env: "OPENROUTER_API_KEY"

model:
  provider: "opencodex"
  default: "gpt-6-luna"
  max_history: 10        # Janela deslizante: 10 últimas mensagens
  max_tokens: 4000

fallback_model:
  - provider: "opencodex"
    model: "google-antigravity/gemini-3.8-flash"
  - provider: "openrouter"
    model: "google/gemini-3.8-flash"

platform_toolsets:
  telegram: [web, file, skills, todo, messaging, terminal, code_execution, memory, session_search, cronjob, vision]

telegram:
  dm_policy: "open"

memory:
  enabled: true

curator:
  enabled: true
  model: "google-antigravity/gemini-3.8-flash"

timezone: "America/Sao_Paulo"

mcp_servers:
  newsapi:
    command: "npx"
    args: ["-y", "mcp-newsapi"]
    env:
      NEWSAPI_API_KEY: "${NEWSAPI_API_KEY}"
  playwright:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--browser", "chromium"]
