# Hermes Agent — Configuration
providers:
  gemini:
    key_env: "GEMINI_API_KEY"

model:
  provider: "gemini"
  default: "gemini-3.7-flash"

fallback_model:
  - provider: "gemini"
    model: "gemini-3.1-flash-lite"

platform_toolsets:
  telegram: [web, file, skills, todo, messaging, terminal, code_execution, memory, session_search, cronjob, vision]

telegram:
  dm_policy: "open"

memory:
  enabled: true

timezone: "America/Sao_Paulo"

mcp_servers:
  newsapi:
    command: "npx"
    args: ["-y", "mcp-newsapi"]
    env:
      NEWSAPI_API_KEY: "${NEWSAPI_API_KEY}"
  playwright:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--browser", "chromium"]
