# Hermes Agent — Template de configuração oficial (Nous Research)
# Copiar para ~/.hermes/config.yaml no celular.
# Este arquivo NÃO contém valores reais — é seguro para o GitHub.
#
# Os segredos ficam em ~/.hermes/.env no celular (nunca no repo):
#   TELEGRAM_BOT_TOKEN=...
#   GROQ_API_KEY=...

providers:
  groq:
    base_url: "https://api.groq.com/openai/v1"
    key_env: "GROQ_API_KEY"

model:
  provider: "custom:groq"
  default: "openai/gpt-oss-120b"

fallback_model:
  - provider: "custom:groq"
    model: "openai/gpt-oss-20b"
  - provider: "custom:groq"
    model: "qwen/qwen3.8-27b"

telegram:
  dm_policy: "open"

memory:
  enabled: true

timezone: "America/Sao_Paulo"

