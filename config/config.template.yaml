# Hermes Agent — Configuração
# Provedor padrão: Gemini 3.8 via OpenRouter

providers:
  openrouter:
    key_env: "OPENROUTER_API_KEY"
  opencodex:
    base_url: "http://212.85.23.10:10100/v1"
    api_key: "ocx-local"
    api_mode: "chat_completions"

model:
  provider: "openrouter"
  default: "google/gemini-3.8-flash"
  max_history: 10        # Janela deslizante: 10 últimas mensagens
  max_tokens: 2000       # Otimizado para cota do OpenRouter

fallback_model:
  - provider: "openrouter"
    model: "google/gemini-3.7-flash"
  - provider: "openrouter"
    model: "anthropic/claude-sonnet-5.5"
  - provider: "opencodex"
    model: "gpt-6-luna"

platform_toolsets:
  telegram: [web, file, skills, todo, messaging, terminal, code_execution, memory, session_search, cronjob, vision]

telegram:
  dm_policy: "open"

memory:
  enabled: true

curator:
  enabled: true
  model: "google/gemini-3.8-flash"

timezone: "America/Sao_Paulo"

mcp_servers:
  newsapi:
    command: "npx"
    args: ["-y", "mcp-newsapi"]
    env:
      NEWSAPI_API_KEY: "${NEWSAPI_API_KEY}"
  playwright:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--browser", "chromium"]
