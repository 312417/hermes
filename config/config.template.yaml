# Hermes Agent — Configuração
# Otimizado para economia de tokens + alta performance

providers:
  opencodex:
    base_url: "http://127.0.0.1:10100/v1"
    api_key: "ocx-local"
    api_mode: "chat_completions"
  gemini:
    key_env: "GEMINI_API_KEY"
  openrouter:
    key_env: "OPENROUTER_API_KEY"

model:
  provider: "opencodex"
  default: "gpt-6-luna"
  max_history: 10        # Janela deslizante: apenas as 10 últimas mensagens
  max_tokens: 10000      # Limite máximo de tokens na resposta

fallback_model:
  - provider: "opencodex"
    model: "google-antigravity/gemini-3.8-flash"
  - provider: "opencodex"
    model: "claude-sonnet-4-6"
  - provider: "gemini"
    model: "gemini-3.1-flash-lite"
  - provider: "openrouter"
    model: "google/gemma-4-31b-it:free"

platform_toolsets:
  telegram: [web, file, skills, todo, messaging, terminal, code_execution, memory, session_search, cronjob, vision]

telegram:
  dm_policy: "open"

# Memória semântica de longo prazo (persiste entre sessões, independente do histórico)
memory:
  enabled: true

# Curator: sumarização automática de contexto
curator:
  enabled: true
  model: "gpt-6-luna"

timezone: "America/Sao_Paulo"

mcp_servers:
  newsapi:
    command: "npx"
    args: ["-y", "mcp-newsapi"]
    env:
      NEWSAPI_API_KEY: "${NEWSAPI_API_KEY}"
  playwright:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--browser", "chromium"]
