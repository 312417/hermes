# Hermes Agent — Template de configuração oficial (Nous Research)
# Copiar para ~/.hermes/config.yaml no celular.
# Este arquivo NÃO contém valores reais — é seguro para o GitHub.
#
# Os segredos ficam em ~/.hermes/.env no celular (nunca no repo):
#   TELEGRAM_BOT_TOKEN=...
#   GEMINI_API_KEY=...

providers:
  gemini:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    key_env: "GEMINI_API_KEY"

model:
  provider: "custom:gemini"
  default: "models/gemini-3.8-flash"

fallback_model:
  - provider: "custom:gemini"
    model: "models/gemini-3.6-flash"
  - provider: "custom:gemini"
    model: "models/gemini-3.1-flash-lite"

platform_toolsets:
  telegram: [web, file, skills, todo, messaging, terminal, code_execution, memory, session_search, cronjob, vision]

telegram:
  dm_policy: "open"

memory:
  enabled: true

timezone: "America/Sao_Paulo"

mcp_servers:
  newsapi:
    command: "npx"
    args: ["-y", "mcp-newsapi"]
    env:
      NEWSAPI_API_KEY: "${NEWSAPI_API_KEY}"
  playwright:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--browser", "chromium"]


